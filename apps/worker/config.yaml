# 스코어링 가중치 및 정규화 파라미터 (§3.2.6)
# 코드에서 분리하여 실험 시 재배포 없이 조정 가능하게 한다.

weights:
  financial_health: 0.35
  financial_growth: 0.25
  news_sentiment: 0.25
  macro_adjustment: 0.15

normalization:
  financial_health:
    min: 0
    max: 100
  financial_growth:      # YoY 성장률 (%)
    min: -30
    max: 30
  news_sentiment:        # 30일 시간가중 롤링 감성 점수
    min: -1
    max: 1
  macro_adjustment:      # 거시 조정 스코어
    min: -1
    max: 1

# 발생액 비율 페널티: accrual_ratio 가 높을수록(이익의 질 낮음) 감점
accrual_penalty:
  threshold: 0.10        # 이 값 초과분부터 감점
  max_penalty: 20.0      # financial_health 에서 차감할 최대 점수
  scale: 100.0           # 초과분 * scale = 페널티 (max_penalty 로 클램프)

# 뉴스
news:
  high_impact_threshold: 0.6      # |sentiment_score| 이 값 초과 시 고영향 → LLM 근거 생성
  rolling_window_days: 30
  time_decay_half_life_days: 7    # 시간가중 반감기

# 추천 라벨 컷오프 (final_score 기준)
recommendation_labels:
  - { min: 75, label: "긍정적 신호 우세" }
  - { min: 55, label: "다소 긍정적" }
  - { min: 45, label: "중립" }
  - { min: 25, label: "다소 부정적" }
  - { min: 0,  label: "부정적 신호 우세" }

# 패턴 감지 (Part 2)
patterns:
  volume_surge_multiplier: 2.0    # 20일 평균 거래량 대비
  rsi_overbought: 70
  rsi_oversold: 30
  ma_periods: [5, 20, 60]
