[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investscope"
version = "0.1.0"
description = "InvestScope KIS market-data integration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.7,<3",
    "PyYAML>=6,<7",
    "python-dotenv>=1.0,<2",
    "redis>=5,<6",
    "SQLAlchemy>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "structlog>=24,<26",
    "tenacity>=9,<10",
    "uvicorn>=0.30,<1",
    "websockets>=15,<17",
]

[tool.setuptools.packages.find]
include = ["apps*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "apps/worker/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
