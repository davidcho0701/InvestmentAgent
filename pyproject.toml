[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investscope"
version = "0.1.0"
description = "InvestScope KIS market-data integration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "uvicorn>=0.30,<1",
    "websockets>=15,<17",
]

[tool.setuptools.packages.find]
include = ["apps*"]
